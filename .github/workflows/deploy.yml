name: Deploy to GitHub Pages

# Bygger Vite-appen og publiserer den til GitHub Pages hver gang main oppdateres.
on:
  push:
    branches: [main]
  # Lar deg også kjøre deployen manuelt fra Actions-fanen.
  workflow_dispatch:

# Rettigheter som trengs for å deploye til Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Kjør kun én deploy om gangen; ikke avbryt en pågående produksjonsdeploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
